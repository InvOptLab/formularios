<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich MUI Primary Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- Clip metallic / light blue gradient -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>

    <!-- Floating badge gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- Soft drop shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#061d40" flood-opacity="0.32"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061d40" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Base container: Squircle / rounded badge -->
  <rect x="24" y="24" width="464" height="464" rx="114" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="462" height="462" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Clipboard Form Paper with shadow -->
  <g filter="url(#shadow)">
    <rect x="106" y="116" width="300" height="324" rx="34" fill="#FFFFFF"/>
    <!-- Top Clip -->
    <rect x="194" y="86" width="124" height="50" rx="14" fill="url(#clipGrad)"/>
    <rect x="226" y="100" width="60" height="15" rx="7.5" fill="#1565C0" fill-opacity="0.35"/>
  </g>

  <!-- Document Checklist Content -->
  <!-- Row 1: Selected item with checkmark -->
  <rect x="148" y="174" width="38" height="38" rx="11" fill="#E3F2FD"/>
  <path d="M157 193 L165 201 L177 185" fill="none" stroke="#1976D2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="186" width="170" height="15" rx="7.5" fill="#1976D2" fill-opacity="0.9"/>

  <!-- Row 2: Secondary item -->
  <rect x="148" y="234" width="38" height="38" rx="11" fill="#F0F4F8"/>
  <path d="M157 253 L165 261 L177 245" fill="none" stroke="#90CAF9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="246" width="140" height="15" rx="7.5" fill="#64B5F6"/>

  <!-- Row 3: Third item -->
  <rect x="148" y="294" width="38" height="38" rx="11" fill="#F0F4F8"/>
  <rect x="200" y="306" width="105" height="15" rx="7.5" fill="#90CAF9"/>

  <!-- Floating Priority / Approval Badge at bottom right -->
  <g filter="url(#badgeShadow)">
    <circle cx="365" cy="375" r="74" fill="#FFFFFF"/>
    <circle cx="365" cy="375" r="62" fill="url(#badgeGrad)"/>
    <!-- White Checkmark in Badge -->
    <path d="M339 376 L358 395 L393 355" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>